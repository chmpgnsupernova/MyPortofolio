<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0D10" />

    <title>Brian Mariarvin — UI/UX Designer</title>
    <meta
      name="description"
      content="UI/UX Designer with an IT background. I design interfaces, then build them, so handoff to engineering is a conversation, not a translation."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brian Mariarvin — UI/UX Designer" />
    <meta
      property="og:description"
      content="UI/UX Designer with an IT background. I design interfaces, then build them."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Terapkan pilihan tema sebelum paint pertama. Tanpa ini,
         halaman berkedip dengan tema dasar lalu berganti. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light" || t === "dark")
            document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts: 4 file, latin subset, display=swap.
         Space Grotesk 500 · Inter 400/500 · JetBrains Mono 400 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
